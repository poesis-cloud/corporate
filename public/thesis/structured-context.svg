<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="400" height="220" rx="10" fill="#0a0f1c"/>

  <!-- brain silhouette -->
  <path d="M200,32
           C168,22 128,30 108,58
           C88,86 86,122 102,146
           C116,170 152,184 200,182
           C248,184 284,170 298,146
           C314,122 312,86 292,58
           C272,30 232,22 200,32 Z"
        fill="rgba(56,189,248,0.05)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.75"/>

  <!-- hemispheric divider -->
  <path d="M200,32 C194,60 206,84 198,108 C192,132 206,158 200,182"
        stroke="rgba(148,163,184,0.4)" stroke-width="1.5" fill="none" stroke-dasharray="3 5"/>

  <!-- LEFT: statistical fuzz (correlation) -->
  <g fill="#94a3b8">
    <circle cx="126" cy="70" r="2.5" opacity="0.35"/>
    <circle cx="142" cy="54" r="1.8" opacity="0.28"/>
    <circle cx="160" cy="66" r="3" opacity="0.4"/>
    <circle cx="118" cy="94" r="2" opacity="0.3"/>
    <circle cx="138" cy="86" r="1.5" opacity="0.25"/>
    <circle cx="156" cy="92" r="2.6" opacity="0.38"/>
    <circle cx="176" cy="78" r="1.7" opacity="0.3"/>
    <circle cx="182" cy="58" r="2.2" opacity="0.33"/>
    <circle cx="112" cy="118" r="2.4" opacity="0.32"/>
    <circle cx="130" cy="110" r="1.6" opacity="0.26"/>
    <circle cx="150" cy="118" r="2.8" opacity="0.4"/>
    <circle cx="170" cy="106" r="1.9" opacity="0.3"/>
    <circle cx="186" cy="96" r="1.4" opacity="0.24"/>
    <circle cx="122" cy="140" r="2.1" opacity="0.3"/>
    <circle cx="142" cy="134" r="1.7" opacity="0.27"/>
    <circle cx="162" cy="142" r="2.5" opacity="0.36"/>
    <circle cx="180" cy="128" r="1.8" opacity="0.28"/>
    <circle cx="150" cy="158" r="2" opacity="0.3"/>
    <circle cx="172" cy="156" r="1.5" opacity="0.25"/>
    <circle cx="188" cy="144" r="2.3" opacity="0.32"/>
    <circle cx="134" cy="70" r="1.3" opacity="0.22"/>
    <circle cx="168" cy="88" r="1.4" opacity="0.24"/>
  </g>

  <!-- RIGHT: explicit causal graph (structure) -->
  <g stroke="#5eead4" stroke-width="1.6" fill="none" opacity="0.9">
    <line x1="222" y1="58" x2="252" y2="52" marker-end="url(#arrow)"/>
    <line x1="256" y1="56" x2="278" y2="74" marker-end="url(#arrow)"/>
    <line x1="222" y1="62" x2="230" y2="88" marker-end="url(#arrow)"/>
    <line x1="236" y1="94" x2="260" y2="102" marker-end="url(#arrow)"/>
    <line x1="280" y1="80" x2="268" y2="98" marker-end="url(#arrow)"/>
    <line x1="268" y1="108" x2="282" y2="124" marker-end="url(#arrow)"/>
    <line x1="234" y1="98" x2="242" y2="128" marker-end="url(#arrow)"/>
    <line x1="262" y1="108" x2="248" y2="128" marker-end="url(#arrow)"/>
    <line x1="242" y1="138" x2="224" y2="148" marker-end="url(#arrow)"/>
  </g>
  <g fill="#2dd4bf" filter="url(#glow)">
    <circle cx="218" cy="60" r="5"/>
    <circle cx="256" cy="52" r="5"/>
    <circle cx="282" cy="77" r="5"/>
    <circle cx="232" cy="92" r="5"/>
    <circle cx="264" cy="104" r="5"/>
    <circle cx="285" cy="128" r="5"/>
    <circle cx="245" cy="132" r="5"/>
    <circle cx="220" cy="151" r="5"/>
  </g>

  <!-- small = : structure beats size -->
  <g stroke="rgba(148,163,184,0.5)" stroke-width="2">
    <line x1="60" y1="102" x2="80" y2="102"/>
    <line x1="60" y1="110" x2="80" y2="110"/>
    <line x1="66" y1="93" x2="74" y2="119" stroke="rgba(45,212,191,0.8)"/>
  </g>
  <g stroke="rgba(94,234,212,0.9)" stroke-width="2">
    <line x1="320" y1="102" x2="344" y2="102"/>
    <line x1="320" y1="110" x2="344" y2="110"/>
  </g>
  <path d="M326,88 L332,96 L342,82" stroke="#2dd4bf" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
