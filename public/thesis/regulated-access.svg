<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="rgba(45,212,191,0.28)"/>
      <stop offset="1" stop-color="rgba(45,212,191,0.02)"/>
    </linearGradient>
  </defs>

  <rect width="400" height="220" rx="10" fill="#0a0f1c"/>

  <!-- skyline of the regulated city (destination) -->
  <g fill="#12203a" stroke="#334155" stroke-width="1">
    <rect x="118" y="34" width="22" height="34"/>
    <rect x="144" y="22" width="26" height="46"/>
    <rect x="174" y="30" width="18" height="38"/>
    <rect x="230" y="26" width="24" height="42"/>
    <rect x="258" y="36" width="20" height="32"/>
  </g>
  <!-- bank/institution with pediment at center -->
  <g>
    <rect x="196" y="42" width="30" height="26" fill="#152742" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <polygon points="193,42 211,30 229,42" fill="#152742" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <g stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.8">
      <line x1="202" y1="48" x2="202" y2="66"/>
      <line x1="211" y1="48" x2="211" y2="66"/>
      <line x1="220" y1="48" x2="220" y2="66"/>
    </g>
  </g>
  <!-- lit windows -->
  <g fill="#5eead4" opacity="0.7">
    <rect x="150" y="30" width="4" height="4"/><rect x="160" y="40" width="4" height="4"/>
    <rect x="124" y="42" width="4" height="4"/><rect x="238" y="34" width="4" height="4"/>
    <rect x="246" y="48" width="4" height="4"/><rect x="264" y="44" width="4" height="4"/>
  </g>

  <!-- the road, perspective from bottom to the city -->
  <polygon points="211,68 231,68 322,208 100,208" fill="url(#road)"/>
  <g stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.6">
    <line x1="211" y1="68" x2="100" y2="208"/>
    <line x1="231" y1="68" x2="322" y2="208"/>
  </g>
  <!-- centre dashes -->
  <g stroke="#5eead4" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="221" y1="78" x2="221" y2="86"/>
    <line x1="220" y1="102" x2="220" y2="114"/>
    <line x1="219" y1="134" x2="219" y2="150"/>
    <line x1="217" y1="172" x2="217" y2="194"/>
  </g>

  <!-- checkpoint arch 1 (far): explainability -->
  <g filter="url(#glow)">
    <path d="M196,96 L196,80 L248,80 L248,96" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <rect x="206" y="72" width="32" height="10" rx="3" fill="#0d1830" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="222" cy="77" r="2.4" fill="#38bdf8"/>
  </g>

  <!-- checkpoint arch 2 (mid): governance -->
  <g filter="url(#glow)">
    <path d="M172,132 L172,106 L272,106 L272,132" stroke="#2dd4bf" stroke-width="3" fill="none"/>
    <rect x="196" y="96" width="52" height="13" rx="3" fill="#0e2827" stroke="#2dd4bf" stroke-width="1.4"/>
    <circle cx="222" cy="102.5" r="3" fill="#2dd4bf"/>
  </g>

  <!-- checkpoint arch 3 (near): audit — barrier open -->
  <g filter="url(#glow)">
    <path d="M136,192 L136,142 L308,142 L308,192" stroke="#5eead4" stroke-width="3.5" fill="none"/>
    <rect x="182" y="128" width="80" height="17" rx="4" fill="#0e2827" stroke="#5eead4" stroke-width="1.6"/>
    <circle cx="222" cy="136.5" r="3.6" fill="#5eead4"/>
    <!-- raised barrier arm -->
    <line x1="136" y1="176" x2="166" y2="146" stroke="#eaf0fa" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#f43f5e" stroke-width="4" stroke-linecap="round">
      <line x1="141" y1="171" x2="148" y2="164"/>
      <line x1="155" y1="157" x2="162" y2="150"/>
    </g>
  </g>

  <!-- shield stamp beside the gate: entry conditions met -->
  <g transform="translate(322,158)" filter="url(#glow)">
    <path d="M0,-16 L14,-10 L14,2 C14,11 7,17 0,20 C-7,17 -14,11 -14,2 L-14,-10 Z"
          fill="#0e2827" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M-6,0 L-1.5,5 L7,-6" stroke="#5eead4" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
