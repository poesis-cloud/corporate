<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="rgba(56,189,248,0.28)"/>
      <stop offset="1" stop-color="rgba(56,189,248,0.02)"/>
    </linearGradient>
    <radialGradient id="horizon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(94,234,212,0.28)"/>
      <stop offset="1" stop-color="rgba(94,234,212,0)"/>
    </radialGradient>
  </defs>

  <rect width="400" height="220" rx="10" fill="#0a0f1c"/>

  <!-- destination: the regulated (EU) market -->
  <ellipse cx="221" cy="68" rx="120" ry="34" fill="url(#horizon)"/>
  <line x1="48" y1="68" x2="394" y2="68" stroke="#334155" stroke-width="1.2" stroke-opacity="0.8"/>
  <g fill="#ffcc00" filter="url(#glow)">
    <path d="M221,14 l1.8,3.8 4.2,.6 -3,3 .7,4.2 -3.7,-2 -3.7,2 .7,-4.2 -3,-3 4.2,-.6 Z"/>
    <path d="M193,22 l1.6,3.4 3.8,.5 -2.7,2.7 .6,3.8 -3.3,-1.8 -3.3,1.8 .6,-3.8 -2.7,-2.7 3.8,-.5 Z" opacity="0.85"/>
    <path d="M249,22 l1.6,3.4 3.8,.5 -2.7,2.7 .6,3.8 -3.3,-1.8 -3.3,1.8 .6,-3.8 -2.7,-2.7 3.8,-.5 Z" opacity="0.85"/>
  </g>
  <text x="221" y="60" font-family="ui-sans-serif,system-ui" font-size="24" font-weight="700" fill="#38bdf8" text-anchor="middle" filter="url(#glow)">€</text>

  <!-- the road, perspective from bottom to the horizon -->
  <polygon points="211,68 231,68 332,208 110,208" fill="url(#road)"/>
  <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6">
    <line x1="211" y1="68" x2="110" y2="208"/>
    <line x1="231" y1="68" x2="332" y2="208"/>
  </g>
  <!-- centre dashes -->
  <g stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="221" y1="78" x2="221" y2="86"/>
    <line x1="221" y1="102" x2="221" y2="114"/>
    <line x1="221" y1="134" x2="221" y2="150"/>
    <line x1="221" y1="172" x2="221" y2="194"/>
  </g>

  <!-- checkpoint arch 1 (far): explainability -->
  <g filter="url(#glow)">
    <path d="M195,96 L195,80 L247,80 L247,96" stroke="#2dd4bf" stroke-width="2.5" fill="none"/>
    <rect x="205" y="72" width="32" height="10" rx="3" fill="#0e2827" stroke="#2dd4bf" stroke-width="1.2"/>
    <circle cx="221" cy="77" r="2.4" fill="#5eead4"/>
  </g>
  <g transform="translate(262,84) scale(0.5)" filter="url(#glow)">
    <path d="M0,-16 L14,-10 L14,2 C14,11 7,17 0,20 C-7,17 -14,11 -14,2 L-14,-10 Z"
          fill="#0e2827" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M-6,0 L-1.5,5 L7,-6" stroke="#5eead4" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- checkpoint arch 2 (mid): governance -->
  <g filter="url(#glow)">
    <path d="M171,132 L171,106 L271,106 L271,132" stroke="#2dd4bf" stroke-width="3" fill="none"/>
    <rect x="195" y="96" width="52" height="13" rx="3" fill="#0e2827" stroke="#2dd4bf" stroke-width="1.4"/>
    <circle cx="221" cy="102.5" r="3" fill="#5eead4"/>
  </g>
  <g transform="translate(290,114) scale(0.72)" filter="url(#glow)">
    <path d="M0,-16 L14,-10 L14,2 C14,11 7,17 0,20 C-7,17 -14,11 -14,2 L-14,-10 Z"
          fill="#0e2827" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M-6,0 L-1.5,5 L7,-6" stroke="#5eead4" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- checkpoint arch 3 (near): audit -->
  <g filter="url(#glow)">
    <path d="M135,192 L135,142 L307,142 L307,192" stroke="#5eead4" stroke-width="3.5" fill="none"/>
    <rect x="181" y="128" width="80" height="17" rx="4" fill="#0e2827" stroke="#5eead4" stroke-width="1.6"/>
    <circle cx="221" cy="136.5" r="3.6" fill="#5eead4"/>
  </g>

  <!-- shield stamp beside the near gate: entry conditions met -->
  <g transform="translate(330,158)" filter="url(#glow)">
    <path d="M0,-16 L14,-10 L14,2 C14,11 7,17 0,20 C-7,17 -14,11 -14,2 L-14,-10 Z"
          fill="#0e2827" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M-6,0 L-1.5,5 L7,-6" stroke="#5eead4" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
