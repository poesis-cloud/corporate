<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="220" rx="10" fill="#0a0f1c"/>

  <!-- ===== isometric platform layers (bottom to top) ===== -->

  <!-- layer 3: audit & accountability (base) -->
  <g>
    <polygon points="200,148 320,178 200,208 80,178" fill="#101a30" stroke="#334155" stroke-width="1.5"/>
    <polygon points="80,178 200,208 200,216 80,186" fill="#0b1120"/>
    <polygon points="320,178 200,208 200,216 320,186" fill="#0d1526"/>
    <line x1="30" y1="178" x2="74" y2="178" stroke="#334155" stroke-width="1.2"/>
    <text x="30" y="172" font-family="ui-sans-serif,system-ui" font-size="10" fill="#94a3b8">audit evidence</text>
  </g>

  <!-- layer 2: human loop -->
  <g>
    <polygon points="200,118 300,143 200,168 100,143" fill="#12203a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.55"/>
    <polygon points="100,143 200,168 200,176 100,151" fill="#0d1830"/>
    <polygon points="300,143 200,168 200,176 300,151" fill="#0f1c36"/>
    <!-- accountable human standing on the layer -->
    <g transform="translate(272,140)">
      <circle cx="0" cy="-9" r="3.4" fill="#eaf0fa"/>
      <path d="M-5,1 C-5,-4 5,-4 5,1 Z" fill="#eaf0fa"/>
    </g>
    <line x1="30" y1="143" x2="94" y2="143" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.55"/>
    <text x="30" y="137" font-family="ui-sans-serif,system-ui" font-size="10" fill="#7dd3fc">human loop</text>
  </g>

  <!-- layer 1: governed context -->
  <g>
    <polygon points="200,88 280,108 200,128 120,108" fill="#123231" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.7"/>
    <polygon points="120,108 200,128 200,136 120,116" fill="#0e2827"/>
    <polygon points="280,108 200,128 200,136 280,116" fill="#102c2b"/>
    <line x1="30" y1="108" x2="114" y2="108" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="30" y="102" font-family="ui-sans-serif,system-ui" font-size="10" fill="#5eead4">governed context</text>
  </g>

  <!-- ===== the model chip, docking into the stack ===== -->
  <g transform="translate(200,40)" filter="url(#glow)">
    <rect x="-26" y="-18" width="52" height="36" rx="6" fill="#101a30" stroke="#818cf8" stroke-width="2"/>
    <text x="0" y="5" font-family="ui-sans-serif,system-ui" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">LLM</text>
    <!-- chip pins -->
    <g stroke="#818cf8" stroke-width="2">
      <line x1="-32" y1="-8" x2="-26" y2="-8"/><line x1="-32" y1="0" x2="-26" y2="0"/><line x1="-32" y1="8" x2="-26" y2="8"/>
      <line x1="26" y1="-8" x2="32" y2="-8"/><line x1="26" y1="0" x2="32" y2="0"/><line x1="26" y1="8" x2="32" y2="8"/>
    </g>
  </g>

  <!-- docking arrow, chip → stack apex -->
  <line x1="200" y1="63" x2="200" y2="78" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.85"/>
  <path d="M195,76 L200,84 L205,76" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- output: the assembled platform acts -->
  <g filter="url(#glow)">
    <path d="M286,106 C316,96 336,80 346,60" stroke="#2dd4bf" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M338,62 L347,57 L348,67" stroke="#2dd4bf" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="332" y="48" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="700" fill="#5eead4">acts</text>
  </g>
</svg>
