<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="swap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="400" height="220" rx="10" fill="#0a0f1c"/>

  <!-- ===== LEFT: standalone model — swappable commodity ===== -->
  <g>
    <!-- swap cycle arrows around the chips -->
    <path d="M96,60 A46,46 0 0 1 140,102" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#swap)"/>
    <path d="M96,152 A46,46 0 0 1 52,110" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#swap)"/>

    <!-- ghost chips cycling -->
    <g opacity="0.45">
      <rect x="52" y="52" width="44" height="30" rx="4" fill="#101a30" stroke="#64748b" stroke-width="1.5"/>
      <text x="74" y="71" font-family="ui-sans-serif,system-ui" font-size="9" fill="#94a3b8" text-anchor="middle">model B</text>
    </g>
    <g opacity="0.45">
      <rect x="52" y="130" width="44" height="30" rx="4" fill="#101a30" stroke="#64748b" stroke-width="1.5"/>
      <text x="74" y="149" font-family="ui-sans-serif,system-ui" font-size="9" fill="#94a3b8" text-anchor="middle">model C</text>
    </g>
    <g>
      <rect x="74" y="91" width="44" height="30" rx="4" fill="#101a30" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="96" y="110" font-family="ui-sans-serif,system-ui" font-size="9" fill="#c3cdde" text-anchor="middle">model A</text>
    </g>

    <text x="96" y="188" font-family="ui-sans-serif,system-ui" font-size="10" fill="#64748b" text-anchor="middle">standalone — swappable</text>
  </g>

  <!-- divider -->
  <line x1="172" y1="26" x2="172" y2="194" stroke="rgba(148,163,184,0.25)" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- ===== RIGHT: same model soldered into the governed platform board ===== -->
  <g>
    <!-- circuit board -->
    <rect x="192" y="34" width="188" height="146" rx="8" fill="#0d1b2b" stroke="#2dd4bf" stroke-width="1.6" stroke-opacity="0.55"/>

    <!-- LLM chip seated in socket -->
    <g filter="url(#glow)">
      <rect x="256" y="82" width="60" height="44" rx="5" fill="#101a30" stroke="#818cf8" stroke-width="2"/>
      <text x="286" y="108" font-family="ui-sans-serif,system-ui" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">LLM</text>
    </g>
    <!-- socket frame -->
    <rect x="250" y="76" width="72" height="56" rx="7" fill="none" stroke="#2dd4bf" stroke-width="1.4" stroke-dasharray="3 3" stroke-opacity="0.8"/>

    <!-- traces to platform modules -->
    <g stroke="#2dd4bf" stroke-width="1.8" fill="none" stroke-opacity="0.85">
      <path d="M270,82 L270,66 L246,66 L246,58"/>
      <path d="M302,82 L302,66 L330,66 L330,58"/>
      <path d="M286,126 L286,146"/>
    </g>
    <!-- solder joints -->
    <g fill="#5eead4">
      <circle cx="246" cy="58" r="2.6"/>
      <circle cx="330" cy="58" r="2.6"/>
      <circle cx="286" cy="146" r="2.6"/>
    </g>

    <!-- platform modules -->
    <g>
      <rect x="202" y="42" width="86" height="16" rx="4" fill="#0e2827" stroke="#2dd4bf" stroke-width="1.4"/>
      <text x="245" y="53" font-family="ui-sans-serif,system-ui" font-size="8.5" fill="#5eead4" text-anchor="middle">grounded inference</text>
    </g>
    <g>
      <rect x="290" y="42" width="86" height="16" rx="4" fill="#0e2827" stroke="#2dd4bf" stroke-width="1.4"/>
      <text x="333" y="53" font-family="ui-sans-serif,system-ui" font-size="8" fill="#5eead4" text-anchor="middle">governed execution</text>
    </g>
    <g>
      <rect x="238" y="146" width="96" height="16" rx="4" fill="#0e2827" stroke="#2dd4bf" stroke-width="1.4"/>
      <text x="286" y="157" font-family="ui-sans-serif,system-ui" font-size="8.5" fill="#5eead4" text-anchor="middle">model specialisation</text>
    </g>

    <!-- shield: defensible -->
    <g transform="translate(360,168)" filter="url(#glow)">
      <path d="M0,-13 L11,-8 L11,1 C11,8 5.5,13 0,15.5 C-5.5,13 -11,8 -11,1 L-11,-8 Z"
            fill="#0e2827" stroke="#2dd4bf" stroke-width="1.8"/>
      <path d="M-4.5,0 L-1,4 L5.5,-4.5" stroke="#5eead4" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="286" y="196" font-family="ui-sans-serif,system-ui" font-size="10" fill="#5eead4" text-anchor="middle">platform-embedded — defensible</text>
  </g>
</svg>
